services:
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto_broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  simulator:
    build: sensor
    container_name: sensors_simulator
    depends_on:
      - mqtt-broker
    restart: unless-stopped

  db:
    image: timescale/timescaledb:latest-pg16
    container_name: mqtt_monitoring_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Одноразовый прогон миграций из db/migrations/ — не часть api/ или consumer/, см.
  # docs/PROJECT.md, раздел «Миграции БД». Consumer и API, когда появятся в docker-compose,
  # должны объявить depends_on: migrate (condition: service_completed_successfully).
  #
  # x-multi-statement=true обязателен: TimescaleDB не разрешает
  # CREATE MATERIALIZED VIEW ... WITH (timescaledb.continuous) внутри транзакции, а без
  # этого флага golang-migrate шлёт весь файл одним simple query — Postgres оборачивает
  # такой пакет в неявную транзакцию, и миграция падает. Флаг заставляет выполнять
  # операторы по одному. Цена — миграция теряет атомарность (при ошибке в середине файла
  # часть операторов останется применённой, версия будет помечена dirty), и в SQL нельзя
  # использовать «;» внутри строковых литералов: разбиение наивное, по точке с запятой.
  migrate:
    image: migrate/migrate:v4.17.1
    container_name: mqtt_monitoring_migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable&x-multi-statement=true"
      - "up"
    restart: "no"

volumes:
  db_data:
